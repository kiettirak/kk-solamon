services:
  influxdb:
    image: influxdb:2.7
    container_name: solar_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: solar1234
      DOCKER_INFLUXDB_INIT_ORG: solar-org
      DOCKER_INFLUXDB_INIT_BUCKET: solar-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: solar-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: solar_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: solar1234
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: solar_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: solar1234
      MYSQL_DATABASE: solardata
      MYSQL_USER: solar
      MYSQL_PASSWORD: solar1234
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/views.sql:/docker-entrypoint-initdb.d/views.sql
      - ./mysql/weather.sql:/docker-entrypoint-initdb.d/weather.sql
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
  mysql_data:
