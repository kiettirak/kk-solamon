name: kk-solamon

services:
  influxdb:
    image: influxdb:2.7
    container_name: solar_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: solar1234
      DOCKER_INFLUXDB_INIT_ORG: solar-org
      DOCKER_INFLUXDB_INIT_BUCKET: solar-data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: solar-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: solar_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: solar1234
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: solar_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: solar1234
      MYSQL_DATABASE: solardata
      MYSQL_USER: solar
      MYSQL_PASSWORD: solar1234
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/views.sql:/docker-entrypoint-initdb.d/views.sql
      - ./mysql/weather.sql:/docker-entrypoint-initdb.d/weather.sql
    restart: unless-stopped

  weather_collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather_collector
    command: ["./weather-collector"]
    environment:
      MYSQL_DSN: "solar:solar1234@tcp(mysql:3306)/solardata?parseTime=true&loc=Asia%2FBangkok"
      WEATHER_LAT: "17.93046324892076"
      WEATHER_LON: "103.94864700242748"
      WEATHER_START_DATE: "2023-05-23"
      WEATHER_BACKFILL: "true"
      POLL_MINUTES: "10"
      # dummy values — weather-collector ไม่ใช้ แต่ config.LoadConfig() ต้องการ
      API_ID: "dummy"
      API_SECRET: "dummy"
      EMAIL: "dummy@dummy.com"
      PASSWORD: "dummy"
      INFLUX_TOKEN: "dummy"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  influxdb_data:
    external: true
    name: kk-solamon_influxdb_data
  grafana_data:
    external: true
    name: kk-solamon_grafana_data
  mysql_data:
    external: true
    name: kk-solamon_mysql_data
